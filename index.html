<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Cheat Remote — Vercel</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎯</text></svg>">
</head>
<body>
<div id="app">
    <header>
        <h1>🎯 FF REMOTE</h1>
        <div class="status" id="statusBadge">
            <span class="dot offline"></span> Offline
        </div>
    </header>

    <section class="config">
        <div class="form-group">
            <label>Backend URL</label>
            <input type="url" id="backendUrl" placeholder="https://your-ngrok-url.ngrok.io" value="">
            <button id="connectBtn" onclick="connectBackend()">Connect</button>
        </div>
        <div class="form-group" style="margin-top:6px; font-size:12px; color:#6a7a8a;">
            <span>Status: <span id="connectionStatus">Belum terhubung</span></span>
        </div>
    </section>

    <div class="grid">
        <!-- Aimbot -->
        <div class="card">
            <div class="card-header">
                <span>🎯 Aimbot</span>
                <label class="toggle">
                    <input type="checkbox" id="aimbotToggle" onchange="toggleFeature('aimbot')">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-body">
                <div class="param">
                    <label>FOV</label>
                    <input type="range" id="aimFov" min="1" max="40" value="15" oninput="setParam('aim_fov', this.value)">
                    <span id="aimFovVal">15</span>
                </div>
                <div class="param">
                    <label>Smooth</label>
                    <input type="range" id="aimSmooth" min="1" max="20" value="5" oninput="setParam('aim_smooth', this.value)">
                    <span id="aimSmoothVal">5</span>
                </div>
                <div class="param">
                    <label>Target</label>
                    <select id="aimTarget" onchange="setParam('aim_target', this.value)">
                        <option value="head">Head</option>
                        <option value="chest">Chest</option>
                    </select>
                </div>
            </div>
        </div>

        <!-- ESP -->
        <div class="card">
            <div class="card-header">
                <span>👁️ ESP</span>
                <label class="toggle">
                    <input type="checkbox" id="espToggle" onchange="toggleFeature('esp')">
                    <span class="slider"></span>
                </label>
            </div>
            <div class="card-body">
                <div class="checkbox-group">
                    <label><input type="checkbox" id="espBox" onchange="setParam('esp_box', this.checked)"> Box</label>
                    <label><input type="checkbox" id="espHealth" onchange="setParam('esp_health', this.checked)"> Health</label>
                    <label><input type="checkbox" id="espDistance" onchange="setParam('esp_distance', this.checked)"> Distance</label>
                    <label><input type="checkbox" id="espSnaplines" onchange="setParam('esp_snaplines', this.checked)"> Lines</label>
                </div>
            </div>
        </div>

        <!-- Extras -->
        <div class="card">
            <div class="card-header">
                <span>⚡ Extras</span>
            </div>
            <div class="card-body">
                <div class="flex-row">
                    <span>🔫 Triggerbot</span>
                    <label class="toggle"><input type="checkbox" id="triggerbotToggle" onchange="toggleFeature('triggerbot')"><span class="slider"></span></label>
                </div>
                <div class="flex-row">
                    <span>🛡️ No Recoil</span>
                    <label class="toggle"><input type="checkbox" id="noRecoilToggle" onchange="toggleFeature('no_recoil')"><span class="slider"></span></label>
                </div>
                <div class="flex-row">
                    <span>🏃 Speed Hack</span>
                    <label class="toggle"><input type="checkbox" id="speedToggle" onchange="toggleFeature('speed_hack')"><span class="slider"></span></label>
                </div>
                <div class="param">
                    <label>Speed x</label>
                    <input type="range" id="speedMultiplier" min="1.0" max="3.0" step="0.1" value="1.5" oninput="setParam('speed_multiplier', parseFloat(this.value))">
                    <span id="speedMultiplierVal">1.5</span>
                </div>
            </div>
        </div>
    </div>

    <div class="actions">
        <button onclick="captureScreenshot()">📸 Screenshot</button>
        <button onclick="refreshState()">🔄 Refresh</button>
        <span id="clientInfo">Client: 0</span>
    </div>

    <div id="screenshotContainer" style="display:none; margin-top:14px;">
        <img id="screenshotImg" alt="Screenshot" style="width:100%; border-radius:12px; border:1px solid #2a3340;">
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
