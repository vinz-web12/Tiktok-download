<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lacak.ai</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="app">
    <nav class="navbar">
        <div class="logo">🔍 lacak<span>.ai</span></div>
        <div class="nav-badge">⚡ v3.0</div>
    </nav>
    <main>
        <div class="track-card">
            <div class="input-group">
                <label>📱 Nomor WhatsApp</label>
                <input type="text" id="numberInput" placeholder="+62 812 3456 7890" value="+6281234567890">
                <button id="trackBtn" class="btn-primary">🚀 Lacak</button>
                <button id="resetBtn" class="btn-secondary">↺ Reset</button>
            </div>
        </div>
        <div class="grid-2">
            <div class="map-container"><div id="map"></div></div>
            <div class="info-panel">
                <div class="profile-section">
                    <img id="profilePhoto" src="/static/default-avatar.png" alt="Profile" class="avatar">
                    <div>
                        <h2 id="nameDisplay">Alina Putri</h2>
                        <span class="status-badge online" id="statusBadge">● Online</span>
                    </div>
                </div>
                <div class="info-grid">
                    <div><span class="label">Perangkat</span><span class="value" id="deviceDisplay">iPhone 15 Pro</span></div>
                    <div><span class="label">Lokasi</span><span class="value" id="locationDisplay">Jakarta Selatan</span></div>
                    <div><span class="label">Last Seen</span><span class="value" id="lastSeenDisplay">2 menit lalu</span></div>
                    <div><span class="label">Sumber</span><span class="value" id="sourceDisplay">Dummy</span></div>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
